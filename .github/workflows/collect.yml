name: Collecte affluence

on:
  schedule:
    # Toutes les 5 min, décalé de 2 min pour ÉVITER l'heure ronde (:00),
    # créneau le plus chargé où GitHub abandonne des runs. → :02,:07,:12,…,:57
    - cron: '2-59/5 * * * *'
  workflow_dispatch:          # bouton "Run" manuel

# Un seul run à la fois, pour éviter les conflits de commit
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ On travaille sur la branche `data`, PAS sur `main` :
      # chaque commit sur main relance une build GitHub Pages qui annule la
      # précédente — avec un relevé toutes les 10 min, le site ne se
      # republiait quasiment jamais et les appareils restaient sur du vieux code.
      - uses: actions/checkout@v4
        with:
          ref: data

      - name: Récupérer le nombre de visiteurs
        run: node collect.js

      - name: Commit du CSV
        run: |
          git config user.name  "affluence-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- data.csv week.json; then
            git add data.csv week.json
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin data || true
            git push origin HEAD:data
          else
            echo "Aucun changement."
          fi
